<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Flex</title>
    <link rel="stylesheet" href="Style_1.css">
</head>

<body>


    <h1 align="center">
        Display Horizontal Flex
    </h1><br>

    <section class="board">
        <div id="box">1</div>
        <div id="box">2</div>
        <div id="box">3</div>
        <div id="box">4</div>
    </section>
      <section class="board right">
        <div id="box">1</div>
        <div id="box">2</div>
        <div id="box">3</div>
        <div id="box">4</div>
    </section>
      <section class="board center">
        <div id="box">1</div>
        <div id="box">2</div>
        <div id="box">3</div>
        <div id="box">4</div>
    </section>
      <section class=" board justify-between">
        <div id="box">1</div>
        <div id="box">2</div>
        <div id="box">3</div>
        <div id="box">4</div>
    </section>
      <section class=" board justify-around">
        <div id="box">1</div>
        <div id="box">2</div>
        <div id="box">3</div>
        <div id="box">4</div>
    </section>
</body>

</html>
